<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>梁湘潤論八字</title><meta name="description" content="依梁湘潤論八字法整理：排盤、論命次第、大運流年流月檢索，以及論法與出處。">
<link rel="icon" href="./icon.svg"><link rel="stylesheet" href="./src/style.css"><script src="https://regulusab.github.io/nav/nav.js" defer></script></head><body>
<header><h1>梁湘潤論八字</h1><p class="sub">論命次第 · 調候 · 格局順逆 · 金不換大運 · 歲運刑沖合會 · 流月</p><p class="src">排盤：共用模組 mingpan-facts；節氣 JPL DE421；出生時間為地方平時（照輸入使用）；節氣換成出生地地方平時比較；東經 70° 以西日柱干支進一位（日期不動）；0:00 換日</p></header>
<main>
<section class="card" id="formBox"><h2>命主資料</h2>
<div class="grid">
<label>姓名<input id="name" value="虛構範例" autocomplete="off"></label>
<label>性別<select id="gender"><option value="1">男（乾造）</option><option value="0">女（坤造）</option></select></label>
<label>出生日期（國曆）<input type="date" id="date" value="1988-06-15"></label>
<label>出生時間（地方平時）<input type="time" id="time" value="09:30"></label>
<label>排盤時間口徑<select id="timeMode"><option value="clock" selected>地方平時（預設）</option><option value="solar">真太陽時</option></select></label>
<label>出生城市（自動帶入經緯度、時區）<select id="city"></select></label>
<label>經度（東正西負）<input id="lon" type="number" step="0.01" value="121.56"></label>
<label>緯度（北正南負）<input id="lat" type="number" step="0.01" value="25.03"></label>
<label>當地時區（UTC 時差，自訂城市時使用）<input id="tz" type="number" step="0.5" value="8"></label>
<label>流年（論斷年份）<input id="year" type="number" min="1900" max="2100"></label>
</div>
<div class="row"><button id="calc" class="pri">排盤論命</button></div>
<p id="note" class="muted"></p></section>
<nav id="tabs"><button data-t="chart" class="on">命盤與原局</button><button data-t="yun">大運流年</button><button data-t="method">梁氏論法</button><button data-t="bio">生平與著作</button><button data-t="refs">參考資料</button></nav>
<section id="chart" class="pane on"></section>
<section id="yun" class="pane"></section>
<section id="method" class="pane"></section>
<section id="bio" class="pane"></section>
<section id="refs" class="pane"></section>
<footer>※ 本站依梁湘潤論八字法的公開資料整理成規則，自動檢索命盤，僅供研究參考，不構成醫療、法律、投資或其他專業建議。內建範例皆為虛構生辰。梁氏著作仍受著作權保護，本站只以自己的文字摘要方法，出處見「參考資料」。</footer>
</main><script type="module" src="./src/main.js"></script></body></html>
